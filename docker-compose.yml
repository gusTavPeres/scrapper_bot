# docker compose up -d   (antes: cp .env.example .env e defina BOT_PASS)
services:
  monitor-olx:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0              # dentro do container: tudo, na 8080 (a porta de fora é PORT)
      PORT: "8080"
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - dados:/app/data          # banco e backup diário sobrevivem ao container
    restart: unless-stopped

volumes:
  dados:
